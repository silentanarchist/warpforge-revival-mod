# Warpforge Revival's settings for Weblate (the translation site). docker-compose.yml and environment next to this
# file are Weblate's own (github.com/WeblateOrg/docker-compose, commit 36f6f3c) and are left as they are; this file
# and weblate.env hold everything of ours. "docker compose" reads all of them together.
services:
  weblate:
    # 127.0.0.1:8090 is for you on this computer only. The public address goes through Caddy, which runs in its own
    # container: both join the Docker network "wf-proxy", where Caddy reaches Weblate as wf-weblate:8080.
    ports:
      - 127.0.0.1:8090:8080
    networks:
      default:
      wf-proxy:
        aliases:
          - wf-weblate
    env_file:
      - ./environment
      - ./weblate.env
  database:
    env_file:
      - ./environment
      - ./weblate.env
networks:
  wf-proxy:
    external: true
