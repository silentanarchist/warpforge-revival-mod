# Publishes a Release for the build zips committed under releases/.
# Since 0.14.0 (2026-10-17) one Release holds both builds of a version: releases/WarpforgeRevival-<x.y.z>-w.zip (PC)
# and releases/WarpforgeRevival.Android-<x.y.z>-a.zip (Android) become the Release "Warpforge Revival <x.y.z>", tag
# v<x.y.z>, with install steps for each build it holds and the "## <x.y.z>" section of CHANGELOG.md. A zip committed
# after its version's Release exists is added to it. Releases from before 0.14.0 (one per build, tags v<x.y.z>-w /
# v<x.y.z>-a) are left alone: a zip that already has such a Release is skipped. Only the current builds are kept in releases/.
#
# Each new Release is also posted to Discord (title, link and the changelog section) when the
# repository has a secret named DISCORD_WEBHOOK_URL holding a Discord channel webhook link.
# To post a version again, run this workflow by hand and type the version (for example 0.14.0) in "announce".
name: Release

on:
  push:
    branches: [main]
    paths:
      - "releases/*.zip"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      announce:
        description: "Post this version to Discord again (for example 0.14.0). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANNOUNCE: ${{ inputs.announce }}
        run: |
          shopt -s nullglob

          # a version's section of CHANGELOG.md ("## <version> - date" up to the next "## ")
          changelog_section() {
            awk -v v="$1" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } } found' CHANGELOG.md
          }

          # Posts a version to Discord: title, link to its Release, and its changelog section.
          # Does nothing without the DISCORD_WEBHOOK_URL secret, and never fails the run.
          announce() {
            local version="$1" tag="v$1" body
            if [ -z "$DISCORD_WEBHOOK_URL" ]; then
              echo "no DISCORD_WEBHOOK_URL secret: $tag not posted to Discord"
              return 0
            fi
            # Discord shows "### " headings unevenly inside a post, so they become bold lines
            body="$(changelog_section "$version" | sed -E 's/^### +(.*)$/**\1**/')"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              body="See the release page for what changed."
            fi
            jq -n --arg title "Warpforge Revival $version" \
                  --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" \
                  --arg body "$body" '
              { allowed_mentions: { parse: [] },
                embeds: [ { title: $title, url: $url,
                            description: (if ($body | length) > 3900
                                          then $body[0:3900] + "\n... (the rest is on the release page)"
                                          else $body end) } ] }' > discord.json
            # the secret is the plain Discord link; a copy that still ends in /github (the form a
            # GitHub webhook uses) is accepted too
            local url code
            url="$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '[:space:]')"
            url="${url%/}"
            url="${url%/github}"
            code="$(curl -sS -o discord-reply.txt -w '%{http_code}' -H "Content-Type: application/json" -d @discord.json "$url" || true)"
            if [ "${code:0:1}" = "2" ]; then
              echo "posted $tag to Discord"
            else
              echo "::warning::could not post $tag to Discord (answer $code)"
              head -c 600 discord-reply.txt 2>/dev/null || true
              echo
            fi
          }

          # the versions (x.y.z, without -w / -a) that have a zip here
          bases=""
          for zip in releases/WarpforgeRevival-*.zip releases/WarpforgeRevival.Android-*.zip; do
            v="$(basename "$zip" .zip)"; v="${v#WarpforgeRevival.Android-}"; v="${v#WarpforgeRevival-}"
            if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already published (a release from before 0.14.0)"; continue; fi
            base="${v%-*}"
            case " $bases " in *" $base "*) ;; *) bases="$bases $base" ;; esac
          done

          for base in $bases; do
            tag="v$base"
            pc=(releases/WarpforgeRevival-"$base"-*.zip)
            android=(releases/WarpforgeRevival.Android-"$base"-*.zip)
            if gh release view "$tag" >/dev/null 2>&1; then
              have="$(gh release view "$tag" --json assets --jq '.assets[].name')"
              for zip in "${pc[@]}" "${android[@]}"; do
                if ! printf '%s\n' "$have" | grep -qx "$(basename "$zip")"; then
                  gh release upload "$tag" "$zip"
                  echo "$tag: added $(basename "$zip")"
                fi
              done
              continue
            fi
            {
              echo "For game version 1.35.0. This release holds the mod for PC and for Android."
              if [ ${#pc[@]} -gt 0 ]; then
                echo
                echo "**PC** (\`$(basename "${pc[0]}")\`)"
                echo "Install guide: https://wf-revival.silentanarchist.com/guides/pc"
              fi
              if [ ${#android[@]} -gt 0 ]; then
                echo
                echo "**Android** (\`$(basename "${android[0]}")\`)"
                echo "The game on the device has to be patched with the mod loader first: the Warpforge Patcher app does that and"
                echo "also puts this mod in place. Install guides: https://wf-revival.silentanarchist.com/guides/phone (Patcher app),"
                echo "https://wf-revival.silentanarchist.com/guides/android-pc (with a PC), https://wf-revival.silentanarchist.com/guides/mumu (MuMu Player)."
              fi
              echo
              echo "The guides are on the Revival website, which needs an account: sign in or make one at https://wf-revival.silentanarchist.com/login."
              echo
              echo "Games already running the mod update themselves from the server. The source for these builds is the code at this tag."
            } > notes.md
            section="$(changelog_section "$base" | sed 's/^### /#### /')"
            if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
              { echo; echo "## What's new"; echo; printf '%s\n' "$section"; } >> notes.md
            else
              echo "no CHANGELOG.md section for $base"
            fi
            gh release create "$tag" "${pc[@]}" "${android[@]}" --target "$GITHUB_SHA" --title "Warpforge Revival ${base}" --notes-file notes.md --latest
            echo "published $tag"
            announce "$base"
          done

          # a manual run with "announce" filled in posts that version again
          if [ -n "$ANNOUNCE" ]; then
            ANNOUNCE="${ANNOUNCE#v}"
            if gh release view "v$ANNOUNCE" >/dev/null 2>&1; then
              announce "$ANNOUNCE"
            else
              echo "::warning::there is no release v$ANNOUNCE to post"
            fi
          fi
